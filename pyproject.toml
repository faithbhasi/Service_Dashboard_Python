[project]
name = "service-dashboard"
version = "1.0.0"
description = "IT Administration Dashboard: FastAPI backend (Active Directory, Okta sign-in, RBAC, audit) serving a React front end."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "ldap3>=2.9",
  "authlib>=1.3",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.9",
  "tzdata",
  "regex>=2024.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout"]
# Integrated (Kerberos) sign-in to Active Directory, so no AD password is stored. Pick the one for your platform.
kerberos-linux = ["gssapi"]
kerberos-windows = ["winkerberos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
